        run: |
          set -euo pipefail
          printf '%s' "$PATCHER_B64" | base64 --decode | gzip --decompress | python3

      - name: Validate customized source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool extension/manifests/manifest.chrome.json >/dev/null
          python3 -m json.tool extension/manifests/manifest.firefox.json >/dev/null
          node --check extension/background.js
          git diff --check
          test ! -e .github/workflows/build-release.yml
          test ! -e .github/workflows/eslint.yml
          test ! -e .github/workflows/prettier.yml
          test ! -e .github/workflows/crowdin.yml

      - name: Commit synchronized source and workflow cleanup
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git add -A .github/workflows extension/background.js extension/manifests/manifest.chrome.json extension/manifests/manifest.firefox.json

          if git diff --cached --quiet; then
            echo "Repository already matches upstream + manual-push customization."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Sync upstream and reapply manual Discord video push"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          git push --force-with-lease origin HEAD:main
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Decide whether this run should publish a release
        id: publish
        shell: bash
        env:
          UPSTREAM_CHANGED: ${{ steps.sync.outputs.upstream_changed }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_RELEASE: ${{ inputs.force_release }}
        run: |
          set -euo pipefail

          publish=false

          if [[ "$UPSTREAM_CHANGED" == "true" ]]; then
            publish=true
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$FORCE_RELEASE" == "true" ]]; then
            publish=true
          fi

          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Release required: $publish"

      - name: Setup Node
        if: steps.publish.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        if: steps.publish.outputs.publish == 'true'
        shell: bash
        run: npm ci

      - name: Build Chrome extension
        if: steps.publish.outputs.publish == 'true'
        shell: bash
        run: npm run build:chrome

      - name: Validate built Chrome extension
        if: steps.publish.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f extensionBuilds/chrome/manifest.json
          test -f extensionBuilds/chrome/background.js
          python3 -m json.tool extensionBuilds/chrome/manifest.json >/dev/null
          node --check extensionBuilds/chrome/background.js

      - name: Package Chrome extension
        if: steps.publish.outputs.publish == 'true'
        id: package
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          short_sha="${{ steps.sync.outputs.upstream_head }}"
          short_sha="${short_sha:0:7}"
          asset="WebPresence-Manual-Push-Chrome-v${version}-${short_sha}.zip"

          rm -f "$asset"
          (cd extensionBuilds/chrome && zip -qr "$GITHUB_WORKSPACE/$asset" .)
          test -s "$asset"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "Packaged $asset"

      - name: Create GitHub release
        if: steps.publish.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_head }}
        run: |
          set -euo pipefail

          version="${{ steps.package.outputs.version }}"
          asset="${{ steps.package.outputs.asset }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_release }}" == "true" && "${{ steps.sync.outputs.upstream_changed }}" != "true" ]]; then
            tag="manual-push-v${version}-manual-${{ github.run_number }}"
            title="Web Presence Manual Push · v${version} · Manual Build #${{ github.run_number }}"
          else
            tag="manual-push-v${version}-${UPSTREAM_SHA:0:7}-${{ github.run_number }}"
            title="Web Presence Manual Push · v${version} · Upstream ${UPSTREAM_SHA:0:7}"
          fi

          notes="Web Presence build with the manual YouTube → Discord push customization.\n\nUpstream commit: ${UPSTREAM_SHA}\nRepository commit: $(git rev-parse HEAD)\nVersion: ${version}\n\nThe attached ZIP is the built Chrome/Chromium extension. It includes the manual YouTube push context-menu feature and keeps a pushed video active until it is replaced or cleared."

          gh release create "$tag" "$asset" \
            --repo "${{ github.repository }}" \
            --target "$(git rev-parse HEAD)" \
            --title "$title" \
            --notes "$notes" \
            --latest

          echo "Created release $tag"

name: Sync upstream, apply YouTube Push Controller, and release

on:
  workflow_dispatch:
    inputs:
      force_release:
        description: Create a new release even when upstream did not change
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: webpresence-upstream-sync
  cancel-in-progress: false

jobs:
  sync-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Preserve this workflow
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/ytdp-sync.yml
          mkdir -p /tmp/webpresence-sync
          cp .github/workflows/ytdp-sync.yml /tmp/webpresence-sync/ytdp-sync.yml

      - name: Fetch upstream and determine whether it changed
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/KanashiiDev/web-presence.git
          git fetch --prune upstream main
          current_head="$(git rev-parse HEAD)"
          upstream_head="$(git rev-parse upstream/main)"
          merge_base="$(git merge-base HEAD upstream/main)"
          if [[ "$merge_base" == "$upstream_head" ]]; then
            upstream_changed=false
          else
            upstream_changed=true
          fi
          echo "current_head=$current_head" >> "$GITHUB_OUTPUT"
          echo "upstream_head=$upstream_head" >> "$GITHUB_OUTPUT"
          echo "upstream_changed=$upstream_changed" >> "$GITHUB_OUTPUT"
          echo "Current fork HEAD : $current_head"
          echo "Upstream main HEAD: $upstream_head"
          echo "Upstream changed  : $upstream_changed"

      - name: Reset main to upstream and remove every other workflow
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main
          git reset --hard upstream/main
          mkdir -p .github/workflows
          find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -delete
          cp /tmp/webpresence-sync/ytdp-sync.yml .github/workflows/ytdp-sync.yml
          echo "Only .github/workflows/ytdp-sync.yml will remain."


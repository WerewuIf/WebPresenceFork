name: Sync upstream, apply manual YouTube push, and release

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  sync-build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check sync token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SYNC_TOKEN" || { echo "SYNC_TOKEN repository secret is missing."; exit 1; }

      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Configure Git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Preserve this workflow before upstream reset
        run: |
          set -euo pipefail
          mkdir -p /tmp/ytdp-workflow-backup
          cp .github/workflows/ytdp-sync.yml /tmp/ytdp-workflow-backup/ytdp-sync.yml

      - name: Check upstream
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git remote get-url upstream >/dev/null 2>&1 || \
            git remote add upstream https://github.com/KanashiiDev/web-presence.git
          git fetch --no-tags upstream main

          upstream_sha="$(git rev-parse upstream/main)"
          short_sha="${upstream_sha:0:7}"
          version="$(git show upstream/main:package.json | python -c "import json,sys; print(json.load(sys.stdin)['version'])")"
          expected_tag="manual-push-v${version}-${short_sha}"

          last_sync_message="$(git log --grep='^chore: sync upstream ' -1 --format='%s' || true)"
          last_sync_sha="$(printf '%s' "$last_sync_message" | sed 's/^chore: sync upstream //')"

          if [ "$last_sync_sha" = "$upstream_sha" ] && gh release view "$expected_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
            echo "Upstream unchanged and release exists: $upstream_sha"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "Upstream sync/release needed: $upstream_sha"

      - name: Sync to upstream main
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git reset --hard upstream/main
          mkdir -p .github/workflows
          cp /tmp/ytdp-workflow-backup/ytdp-sync.yml .github/workflows/ytdp-sync.yml

      - name: Reapply manual push customization
        if: steps.upstream.outputs.changed == 'true'
        env:
          PATCHER_B64: ""
        run: |
          set -euo pipefail
          python -c "import base64,os; exec(compile(base64.b64decode(os.environ['PATCHER_B64']), '<manual-push-patcher>', 'exec'))"

      - name: Commit synchronized customization
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git add extension/background.js .github/workflows/ytdp-sync.yml

          if ! git diff --cached --quiet; then
            git commit -m "chore: sync upstream ${{ steps.upstream.outputs.upstream_sha }}"
          else
            git commit --allow-empty -m "chore: sync upstream ${{ steps.upstream.outputs.upstream_sha }}"
          fi

          git push --force-with-lease origin HEAD:main

      - name: Setup Node
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        if: steps.upstream.outputs.changed == 'true'
        run: npm ci

      - name: Build Chrome extension
        if: steps.upstream.outputs.changed == 'true'
        run: npm run build:chrome

      - name: Patch generated manifest
        if: steps.upstream.outputs.changed == 'true'
        env:
          MANIFEST_PATCHER_B64: ""
        run: |
          set -euo pipefail
          python -c "import base64,os; exec(compile(base64.b64decode(os.environ['MANIFEST_PATCHER_B64']), '<manifest-patcher>', 'exec'))"

      - name: Package Chrome extension
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail
          touch /tmp/pack-start
          npm run pack:chrome
          find . -type f -name '*.zip' -newer /tmp/pack-start -print

      - name: Locate Chrome package
        if: steps.upstream.outputs.changed == 'true'
        id: package
        run: |
          set -euo pipefail

          package_path="$(find . -type f -name '*.zip' -newer /tmp/pack-start -print | head -n 1)"
          test -n "$package_path"

          short_sha="${{ steps.upstream.outputs.upstream_sha }}"
          short_sha="${short_sha:0:7}"
          output="YouTubeDiscordPresence-manual-push-${short_sha}.zip"

          cp "$package_path" "$output"
          echo "path=$output" >> "$GITHUB_OUTPUT"

      - name: Validate
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail
          test -f extension/background.js
          node --check extension/background.js

          mapfile -t manifests < <(find extensionBuilds/chrome -type f -name manifest.json -print)
          test "${#manifests[@]}" -gt 0

          for manifest in "${manifests[@]}"; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$manifest"
          done

      - name: Create GitHub release
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          short_sha="${{ steps.upstream.outputs.upstream_sha }}"
          short_sha="${short_sha:0:7}"
          tag="manual-push-v${version}-${short_sha}"

          gh release create "$tag" "${{ steps.package.outputs.path }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "Manual Push YouTube → Discord Web · v${version} (${short_sha})" \
            --generate-notes

      - name: No release needed
        if: steps.upstream.outputs.changed != 'true'
        run: echo "Upstream unchanged; no release created."

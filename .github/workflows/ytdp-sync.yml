            UZJhdCMI+FRKgAZYEwDm/Wz0U37u4ZwvRmrVPEfxFp537thLUYzhkkLEPR00UtAaPH3ysfER+JP9
            +AQNJDMNgytuycQvmoE/xBSS3UNpv6PWXDGma6gnwIUPGsDK+7pjXi5L4jXkgVPglHF/wFPz/gDs
            hOHBdCKvDXgqrw1AIcT5avIOtk4zmoMrq1W0+EL+Y3hN2yvxa3fQT/52nTu+DkK2fwoWOOtfsNO1
            7Ga1y+SafW2uPJjSaP8vR3xj0N7cPOokevhZNr+DLPsW7b8saP4n2XqloX6qr2NcNCRCaJ3OCncb
            uWvh4BGmKhh4+iAoX2xAvlhhrExgWQuO+Tn+kol2iLx0CQ75ec2F1v8Nl/ArNHVxAAA=
        run: |
          set -euo pipefail
          printf '%s' "$PATCHER_B64" | base64 --decode | gzip --decompress | python3

      - name: Validate customized source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool extension/manifests/manifest.chrome.json >/dev/null
          python3 -m json.tool extension/manifests/manifest.firefox.json >/dev/null
          node --check extension/background.js
          node --check extension/popup/manual-push.js
          grep -q "MANUAL_PUSH_CONTROLLER_PATCH_V2" extension/background.js
          grep -q "manualPush:getState" extension/popup/manual-push.js
          grep -q "manualPush:pushCurrent" extension/popup/manual-push.js
          grep -q "manualPush:clear" extension/popup/manual-push.js
          git diff --check

          test -f extension/popup/manual-push.html
          test -f extension/popup/manual-push.js
          test -f extension/popup/manual-push.css
          test ! -e .github/workflows/build-release.yml
          test ! -e .github/workflows/eslint.yml
          test ! -e .github/workflows/prettier.yml
          test ! -e .github/workflows/crowdin.yml

      - name: Commit synchronized source and workflow cleanup
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git add -A .github/workflows             extension/background.js             extension/manifests/manifest.chrome.json             extension/manifests/manifest.firefox.json             extension/popup/manual-push.html             extension/popup/manual-push.js             extension/popup/manual-push.css

          if git diff --cached --quiet; then
            echo "Repository already matches upstream + YouTube Push Controller."
            changed=false
          else
            git commit -m "Sync upstream and reapply YouTube Push Controller"
            changed=true
          fi

          git push --force-with-lease origin HEAD:main
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Decide whether this run should publish a release
        id: publish
        shell: bash
        env:
          UPSTREAM_CHANGED: ${{ steps.sync.outputs.upstream_changed }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_RELEASE: ${{ inputs.force_release }}
        run: |
          set -euo pipefail
          publish=false

          if [[ "$UPSTREAM_CHANGED" == "true" ]]; then
            publish=true
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$FORCE_RELEASE" == "true" ]]; then
            publish=true
          fi

          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Release required: $publish"

      - name: Setup Node
        if: steps.publish.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        if: steps.publish.outputs.publish == 'true'
        shell: bash
        run: npm ci

      - name: Build Chrome extension
        if: steps.publish.outputs.publish == 'true'
        shell: bash
        run: npm run build:chrome

      - name: Validate built Chrome extension
        if: steps.publish.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f extensionBuilds/chrome/manifest.json
          test -f extensionBuilds/chrome/background.js
          test -f extensionBuilds/chrome/popup/manual-push.html
          test -f extensionBuilds/chrome/popup/manual-push.js
          test -f extensionBuilds/chrome/popup/manual-push.css

          python3 -m json.tool extensionBuilds/chrome/manifest.json >/dev/null
          node --check extensionBuilds/chrome/background.js
          node --check extensionBuilds/chrome/popup/manual-push.js

      - name: Package Chrome extension
        if: steps.publish.outputs.publish == 'true'
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          short_sha="${{ steps.sync.outputs.upstream_head }}"
          short_sha="${short_sha:0:7}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_release }}" == "true" && "${{ steps.sync.outputs.upstream_changed }}" != "true" ]]; then
            asset="WebPresence-YouTube-Push-Controller-build-${{ github.run_number }}.zip"
          else
            asset="WebPresence-YouTube-Push-Controller-v${version}-${short_sha}.zip"
          fi

          rm -f "$asset"
          (cd extensionBuilds/chrome && zip -qr "$GITHUB_WORKSPACE/$asset" .)
          test -s "$asset"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.publish.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_head }}
        run: |
          set -euo pipefail

          version="${{ steps.package.outputs.version }}"
          asset="${{ steps.package.outputs.asset }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_release }}" == "true" && "${{ steps.sync.outputs.upstream_changed }}" != "true" ]]; then
            base_tag="manual-push-controller-${{ github.run_number }}"
            title="Web Presence YouTube Push Controller · v${version} · Build #${{ github.run_number }}"
          else
            base_tag="manual-push-controller-v${version}-${UPSTREAM_SHA:0:7}"
            title="Web Presence YouTube Push Controller · v${version} · Upstream ${UPSTREAM_SHA:0:7}"
          fi

          tag="$base_tag"
          suffix=1
          while gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; do
            suffix=$((suffix + 1))
            tag="${base_tag}-r${suffix}"
          done

          echo "Selected unique release tag: $tag"

          notes="Web Presence build with the manual YouTube → Discord Push Controller."
          notes+=$'\n\n'
          notes+="It opens a dedicated controller UI showing the current YouTube video and the video currently pinned to Discord. Pushing replaces the pinned video. Clearing removes it. The pinned video is kept active by the existing refresh alarm until replaced or cleared."
          notes+=$'\n\n'
          notes+="Upstream commit: $UPSTREAM_SHA"
          notes+=$'\n'
          notes+="Repository commit: $(git rev-parse HEAD)"
          notes+=$'\n'
          notes+="Version: $version"

          gh release create "$tag" "$asset"             --repo "${{ github.repository }}"             --target "$(git rev-parse HEAD)"             --title "$title"             --notes "$notes"             --latest

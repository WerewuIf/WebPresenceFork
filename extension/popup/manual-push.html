'<!doctype html>\n<html lang="en">\n<head>\n  <meta charset="utf-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n  <title>YouTube → Discord</title>\n  <link rel="stylesheet" href="manual-push.css">\n</head>\n<body>\n  <main class="shell">\n    <header class="header">\n      <div>\n        <div class="eyebrow">WEB PRESENCE</div>\n        <h1>YouTube → Discord</h1>\n      </div>\n      <button class="icon-button" id="refresh" title="Refresh" aria-label="Refresh">↻</button>\n    </header>\n\n    <section class="section">\n      <div class="section-title">Current YouTube Video</div>\n      <article class="card" id="currentCard">\n        <div class="placeholder">Reading current YouTube tab…</div>\n      </article>\n      <div class="actions">\n        <button class="primary" id="pushCurrent" disabled>Push current video</button>\n      </div>\n    </section>\n\n    <section class="section">\n      <div class="section-title">Currently pushed to Discord</div>\n      <article class="card" id="pushedCard">\n        <div class="placeholder">Nothing is pushed.</div>\n      </article>\n      <div class="actions two">\n        <button class="secondary" id="replaceCurrent" disabled>Replace with current</button>\n        <button class="danger" id="clearPushed" disabled>Clear</button>\n      </div>\n    </section>\n\n    <div class="status" id="status" aria-live="polite"></div>\n\n    <footer class="footer">\n      <button class="link-button" id="openLibrary">Activity Library</button>\n      <button class="link-button" id="openOriginal">Open Web Presence</button>\n    </footer>\n  </main>\n\n  <script src="../libs/browser-polyfill.js"></script>\n  <script src="manual-push.js"></script>\n</body>\n</html>\n'
